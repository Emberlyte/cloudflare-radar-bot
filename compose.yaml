services:
  radar-bot:
    container_name: cloudflare-radar-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "pgrep", "-f", "bot.main"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8.6.5-alpine
    container_name: radar-bot-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data: