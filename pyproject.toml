[project]
name = "cloudflare-radar-bot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiogram==3.30.0",
    "dotenv>=0.9.9",
    "matplotlib==3.11.1",
    "pandas>=3.0.3",
    "pandas-stubs~=3.0.3",
    "pydantic-settings>=2.14.2",
    "redis>=8.0.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "aioresponses>=0.7.9",
    "fakeredis>=2.37.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

